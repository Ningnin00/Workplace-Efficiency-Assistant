# Render 部署配置（免费版）
# 部署方法：把 webapp 文件夹上传到 GitHub，然后在 Render 上 New > Web Service
# 选择该仓库即可自动识别此配置

services:
  - type: web
    name: zhinengti-assistant
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    plan: free
    envVars:
      - key: LLM_API_URL
        sync: false   # OpenAI 兼容接口地址，如 https://xxx/v1/chat/completions
      - key: LLM_API_KEY
        sync: false   # 公司 Codex/xfusion API Key
      - key: LLM_MODEL
        value: gpt-5.5
      - key: VERIFY_SSL
        value: "true"
